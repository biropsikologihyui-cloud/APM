<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Kemampuan Umum - Biro Psikologi HYUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { user-select: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

    <!-- Header Bersih (Tanpa Tombol Admin) -->
    <header class="bg-indigo-900 text-white shadow-md py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="font-bold text-lg tracking-wide">Biro Psikologi HYUI - Sistem Tes Online</h1>
        </div>
    </header>

    <!-- Form Login Peserta -->
    <div id="loginSection" class="flex items-center justify-center flex-grow p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-600">Login Peserta Tes</h2>
                <p class="text-sm text-slate-500 mt-1">Masukkan username dan password resmi Anda</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username / No. Peserta</label>
                    <input type="text" id="usernameInput" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Masukkan username...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="passwordInput" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Masukkan password...">
                </div>
                <button type="submit" id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">Mulai Tes (35 Menit)</button>
            </form>
        </div>
    </div>

    <!-- Tampilan Ujian Satu per Satu -->
    <div id="quizSection" class="hidden flex-grow container mx-auto px-4 py-6 max-w-2xl">
        <div class="bg-indigo-900 text-white p-4 rounded-xl shadow-md flex justify-between items-center mb-6 sticky top-4 z-50">
            <div>
                <h2 class="font-bold text-lg" id="quizTitle">Sub Tes</h2>
                <p class="text-xs text-indigo-200">Peserta: <span id="displayUsername" class="font-semibold text-white"></span></p>
            </div>
            <div class="bg-indigo-800 px-4 py-2 rounded-lg border border-indigo-700">
                <span class="text-xs text-indigo-300 block">Sisa Waktu</span>
                <span id="timer" class="font-mono font-bold text-xl text-yellow-400">35:00</span>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <span id="questionNumberIndicator" class="text-sm font-bold text-indigo-600">SOAL NO 1</span>
                <span id="progressIndicator" class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium">1 dari 48</span>
            </div>
            
            <div class="mb-6 flex justify-center bg-slate-50 p-4 rounded-xl border border-slate-100">
                <img id="questionImage" src="" alt="Soal Tes" class="max-h-64 rounded bg-white p-2 object-contain">
            </div>

            <p class="text-sm font-medium text-slate-700 mb-3 text-center">Pilih jawaban (1 s.d. 8):</p>
            <div id="optionsContainer" class="grid grid-cols-4 gap-3 mb-6">
                <!-- Pilihan angka 1-8 digenerate di sini -->
            </div>

            <div class="flex justify-between">
                <button id="prevBtn" onclick="prevQuestion()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg transition hidden">Sebelumnya</button>
                <button id="nextBtn" onclick="nextQuestion()" class="ml-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition shadow-md">Selanjutnya</button>
            </div>
        </div>
    </div>
